name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  FRONTEND_REPO: ${{ secrets.ECR_REPOSITORY }}

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
          tags: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Frontend Container via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Redeploying Frontend Container" \
            --parameters commands="[
              \"mkdir -p /opt/care\",
              \"cd /opt/care\",
              \"cat << 'EOF' > /opt/care/.env.frontend
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          FRONTEND_RESET_URL=${{ secrets.FRONTEND_RESET_URL }}
          EOF\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}\",
              \"docker pull ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest\",
              \"docker stop care_frontend 2>/dev/null || true\",
              \"docker rm care_frontend 2>/dev/null || true\",
              \"docker run -d --name care_frontend --restart always -p 127.0.0.1:3000:3000 --env-file /opt/care/.env.frontend ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:latest\",
              \"docker image prune -af --filter until=24h\"
            ]" \
            --region ${{ env.AWS_REGION }}
